palette = "capsule"
add_newline = true
format = "$username $directory$git_branch $time $character"

[palettes.capsule]
bg     = "#171214"
user   = "#6f2438"
dir    = "#812d42"
git    = "#96394e"
time   = "#a84a58"
fg     = "#f3e9e4"
prompt = "#c25a62"

[username]
show_always = true
style_user = "bg:user fg:fg bold"
style_root = "bg:user fg:fg bold"
format = "[\uE0B6](fg:user)[$user]($style)[\uE0B4](fg:user)"

[directory]
style = "bg:dir fg:fg bold"
format = "[\uE0B6](fg:dir)[$path]($style)[\uE0B4](fg:dir)"
truncation_length = 2
truncate_to_repo = false
truncation_symbol = "~/"

[directory.substitutions]
"~/Dev/projects/cloud" = "projects/cloud"
"~/Dev/projects/" = "~/projects/"
"~/Dev/projects" = "Dev/projects"

[git_branch]
style = "bg:git fg:fg bold"
format = " [\uE0B6](fg:git)[$symbol$branch]($style)[\uE0B4](fg:git)"

[time]
disabled = false
style = "bg:time fg:fg bold"
format = "[\uE0B6](fg:time)[ ❀ $time ]($style)[\uE0B4](fg:time)"
time_format = "%H:%M"

[character]
success_symbol = "[❯](bold fg:prompt)"
error_symbol = "[❯](bold fg:red)"
